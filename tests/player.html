<!doctype html><html lang="en"><meta charset="utf-8"><title>Tone Caption · real video test</title>
<style>body{background:#0d151c;color:#e9f1f4;font:16px system-ui;margin:24px}main{max-width:1000px;margin:auto}video{width:100%;max-height:600px;background:#000}h1{font-weight:500;font-size:20px}button{padding:10px}</style>
<main id="player"><h1 id="title">Real video</h1><video controls playsinline></video><button id="fullscreen">Fullscreen</button></main>
<script>
const q=new URLSearchParams(location.search),v=document.querySelector('video');
v.src=`../.build/real/${q.get('id')}.mp4`;
document.querySelector('#title').textContent=q.get('title')||q.get('id');
const seek=()=>{v.currentTime=Number(q.get('t')||0);};
v.readyState>=1?seek():v.addEventListener('loadedmetadata',seek,{once:true});
document.querySelector('#fullscreen').onclick=()=>document.querySelector('#player').requestFullscreen();
</script></html>
