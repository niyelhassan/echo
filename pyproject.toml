[project]
name = "tone-caption"
version = "0.1.0"
description = "Local system-audio transcription research prototype"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "sounddevice>=0.5,<0.6",
    "mlx-whisper>=0.4,<0.5",
    "transformers>=4.48,<5",
    "funasr>=1.2,<2",
    "torchaudio>=2.5",
    "silero-vad>=6,<7",
    "onnxruntime>=1.20,<2",
    "websockets>=15,<16",
    "parakeet-mlx>=0.7.0",
    "jiwer>=4.0.0",
]

[dependency-groups]
dev = [
    "playwright>=1.50,<2",
]

